spring:
  application:
    name: langchain4j

langchain4j:
  ollama:
    chat-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_CHAT_MODEL:llama3.2}
      temperature: 0.7
      timeout: PT120S
      log-requests: true
      log-responses: true

server:
  port: 8081

logging:
  level:
    dev.langchain4j: INFO
    com.dleon: INFO
