server:
  port: 8080

spring:
  application:
    name: multimodal
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o # Vision
      image:
        options:
          model: gpt-image-1 # Image
      audio:
        speech:
          options:
            model: tts-1 # text-to-speech
            voice: alloy
        transcription:
          options:
            model: whisper-1 # speech-to-text
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
